[package]
name = "latex-ide-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html"] }
dioxus-signals = { workspace = true }
dioxus-hooks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Web-specific dependencies
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "DomTokenList", "HtmlElement", "EventSource", "MessageEvent", "KeyboardEvent"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
tracing = { workspace = true }

[features]
default = []
desktop = ["dioxus/desktop"]
web = ["dioxus/web", "wasm-bindgen", "wasm-bindgen-futures", "js-sys"]