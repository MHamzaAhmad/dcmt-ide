[package]
name = "latex-ide-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dioxus framework with web features
dioxus = { workspace = true, features = ["web", "router", "macro", "html"] }
dioxus-web = { workspace = true }
dioxus-router = { workspace = true }
dioxus-signals = { workspace = true }
dioxus-hooks = { workspace = true }

# UI components and shared crates
latex-ide-ui = { path = "../../crates/ui", features = ["web"] }
latex-ide-editor = { path = "../../crates/editor", features = ["web"] }
latex-ide-chat = { path = "../../crates/chat", features = ["web"] }
latex-ide-file-manager = { path = "../../crates/file-manager", features = ["web"] }
latex-ide-git-transport = { path = "../../crates/git-transport" }
latex-ide-pdf-viewer = { path = "../../crates/pdf-viewer", features = ["web"] }
latex-ide-git-manager = { path = "../../crates/git-manager", optional = true }
latex-ide-llm = { path = "../../crates/llm", features = ["web"] }

# WASM-specific Yrs bindings
yrs = { workspace = true }

# WebAssembly support
wasm-bindgen = { workspace = true, features = ["serde-serialize"] }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement",
    "WebSocket", "EventSource", "BinaryType",
    "MessageEvent", "CloseEvent", "ErrorEvent",
    "Request", "Response", "AbortController",
    "Blob", "BlobPropertyBag", "File", "FileReader", "HtmlInputElement",
    "Storage", "Location", "History", "console", "KeyboardEvent",
    "MediaQueryList", "Url", "Headers"
]}
wasm-bindgen-futures = { workspace = true }

# Async utilities for WASM
gloo-utils = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
gloo-storage = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

# Error handling
anyhow = { workspace = true }

# Logging for WASM
tracing = { workspace = true }
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"

# UUID
uuid = { workspace = true, features = ["js"] }

# Time handling
chrono = { workspace = true, features = ["wasmbind"] }

# Base64 for binary data
base64 = "0.22"

[features]
default = ["dev"]
dev = []
native-git = ["latex-ide-git-manager"]

# WebTransport support (native only, not for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport = { workspace = true }
tokio = { workspace = true }

