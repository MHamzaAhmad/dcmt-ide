[package]
name = "latex-ide-file-manager"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html"] }
dioxus-signals = { workspace = true }
dioxus-hooks = { workspace = true }
latex-ide-ui = { path = "../ui" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Platform-specific dependencies
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
notify = { version = "6.0", optional = true }
rfd = { version = "0.14", optional = true }
dirs = { version = "5.0", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", optional = true }

[features]
default = []
desktop = ["dioxus/desktop", "latex-ide-ui/desktop", "notify", "rfd", "dirs"]
web = ["dioxus/web", "latex-ide-ui/web", "js-sys", "wasm-bindgen", "web-sys", "wasm-bindgen-futures", "gloo-timers"]