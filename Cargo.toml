[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/web",
    "crates/core",
    "crates/editor",
    "crates/ui",
    "crates/latex-compiler",
    "crates/pdf-viewer",
    "crates/ai-chat",
    "crates/yrs-collab",
    "crates/webtransport-server",
    "crates/sse-handler",
    "crates/model-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LaTeX IDE Team"]
license = "MIT"
repository = "https://github.com/yourusername/latex-ide"

[workspace.dependencies]
# Dioxus framework
dioxus = { version = "0.6", features = ["fullstack", "desktop", "web", "router"] }
dioxus-desktop = "0.6"
dioxus-web = "0.6"
dioxus-router = "0.6"
dioxus-signals = "0.6"
dioxus-hooks = "0.6"

# Async runtime
tokio = { version = "1.45", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Yrs CRDT
yrs = "0.21"
ywasm = "0.18"
y-sync = "0.4"

# WebTransport/QUIC
quinn = "0.11"
wtransport = "0.1"
h3 = "0.0.6"
h3-quinn = "0.0.7"

# WebAssembly support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Text editing
ropey = "1.6"
tree-sitter = "0.24"
tree-sitter-latex = "0.3"

# PDF rendering
pdfium-render = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Compression
flate2 = "1.0"

# File watching
notify = "7.0"

# Diff algorithms
similar = "2.6"

# Configuration
config = "0.14"

# Command line
clap = { version = "4.5", features = ["derive"] }

# Regex
regex = "1.11"

# Path utilities
pathdiff = "0.2"

# Process management
sysinfo = "0.33"

# AI/ML Libraries  
kalosm = { version = "0.3", features = ["language", "llama", "mistral", "phi"] }
ollama-rs = "0.2"
openai-api-rs = "5.2"
async-openai = "0.28"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3