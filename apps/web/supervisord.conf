[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/app/logs/supervisord.pid
loglevel=info
silent=false

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Web Frontend Server
[program:web-frontend]
command=live-server --port=8080 --host=0.0.0.0 --entry-file=index.html --no-browser --cors
directory=/app/web
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
autostart=true
autorestart=true
priority=1

# WebTransport/WebSocket Server  
[program:webtransport-server]
command=/app/target/debug/webtransport-server --port=3001 --db-path=/app/data/latex_ide.db
directory=/app
environment=PATH="/root/.TinyTeX/bin/x86_64-linux:%(ENV_PATH)s",TINYTEX_DIR="/root/.TinyTeX"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
autostart=true
autorestart=true
priority=2

# Server-Sent Events Handler
[program:sse-handler]
command=/app/target/debug/sse-handler --port=3002 --db-path=/app/data/latex_ide.db
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
autostart=true
autorestart=true
priority=3

# AI Model Manager
[program:model-manager]
command=/app/target/debug/model-manager --port=3003 --db-path=/app/data/latex_ide.db
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
autostart=true
autorestart=true
priority=4

# LaTeX Compiler Service
[program:latex-compiler]
command=/app/target/debug/latex-compiler --port=3004 --temp-dir=/app/data/tex --latex-bin-path=/root/.TinyTeX/bin/x86_64-linux
directory=/app
environment=PATH="/root/.TinyTeX/bin/x86_64-linux:%(ENV_PATH)s",TINYTEX_DIR="/root/.TinyTeX"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
autostart=true
autorestart=true
priority=5

# Service logs are now streamed directly to container stdout/stderr
# Use 'docker logs <container>' to view all service logs in real-time