[workspace]
resolver = "2"
members = [
    "apps/web",
    "apps/desktop",
    "crates/editor",
    "crates/ui",
    "crates/chat",
    "crates/file-manager",
    "crates/latex-compiler",
    "crates/llm",
    "crates/pdf-viewer",
    "crates/yrs-collab",
    "crates/webtransport-server",
    "crates/sse-handler",
    "crates/model-manager",
    "crates/git-manager",
    "crates/git-transport",
]
exclude = [
    "crates/version-control-ui",  # Temporarily excluded due to compilation errors
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LaTeX IDE Team"]
license = "MIT"
repository = "https://github.com/yourusername/latex-ide"

[workspace.dependencies]
# Dioxus framework (latest stable)
dioxus = { version = "0.6", default-features = false }
dioxus-desktop = "0.6"
dioxus-web = "0.6"
dioxus-router = "0.6"
dioxus-signals = "0.6"
dioxus-hooks = "0.6"

# Async runtime (latest)
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Yrs CRDT
yrs = "0.24.0"
ywasm = "0.24.0"
y-sync = "0.4.0"

# WebTransport/QUIC (latest versions)
quinn = "0.11"
wtransport = "0.6.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# WebAssembly support
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
gloo-timers = { version = "0.3", features = ["futures"] }

# Text editing
ropey = "1.6"
tree-sitter = "0.24"
tree-sitter-latex = "0.1.0"

# PDF rendering
pdfium-render = "0.8"

# Database (latest)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# HTTP server (latest)
axum = "0.7"

# HTTP server middleware
tower = "0.5"
tower-http = "0.6"

# Compression
flate2 = "1.0"

# File watching
notify = "7.0"

# Diff algorithms
similar = "2.6"

# Configuration
config = "0.14"

# Command line
clap = { version = "4.5", features = ["derive"] }

# Regex
regex = "1.11"

# Path utilities
pathdiff = "0.2"

# Process management
sysinfo = "0.33"

# Git operations
git2 = "0.19"
tempfile = "3.8"

# AI/ML Libraries  
kalosm = { version = "0.3", default-features = false, features = ["language"] }
ollama-rs = "0.2"
openai-api-rs = "5.2"
async-openai = "0.28"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3


