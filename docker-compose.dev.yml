services:
  # Unified LaTeX IDE - All services in one container
  latex-ide-unified:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "8080:8080"  # Web frontend
      - "3001:3001"  # WebTransport/WebSocket server
      - "3002:3002"  # SSE handler for AI streaming
      - "3003:3003"  # Model manager API
    volumes:
      - latex-ide-data:/app/data      # Persistent SQLite database
      - latex-ide-logs:/app/logs      # Service logs
      - latex-ide-models:/app/models  # AI model cache
      - ./sample-workspace:/app/workspace:rw  # Primary workspace with sample files
      - ./apps/web:/app/apps/web:rw   # Web app source for hot reload
      - ./apps/desktop:/app/apps/desktop:ro  # Desktop app (needed for Cargo workspace)
      - ./crates:/app/crates:rw       # Rust source code for hot reload
      - ./Cargo.toml:/app/Cargo.toml:rw  # Root Cargo.toml for dependency changes
      - ./Cargo.lock:/app/Cargo.lock:rw  # Cargo.lock for dependency tracking
    environment:
      - NODE_ENV=development
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - DATABASE_URL=sqlite:///app/data/latex_ide.db
      - MODEL_CACHE_DIR=/app/models
      - WORKSPACE_DIR=/app/workspace
      - SAMPLE_WORKSPACE_DIR=/app/workspace
      - LATEX_COMPILER_PATH=/usr/bin/pdflatex
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - latex-ide-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  latex-ide-data:
    driver: local
  latex-ide-logs:
    driver: local
  latex-ide-models:
    driver: local
  latex-ide-workspace:
    driver: local

networks:
  latex-ide-dev:
    driver: bridge