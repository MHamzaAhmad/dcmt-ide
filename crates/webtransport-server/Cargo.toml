[package]
name = "latex-ide-webtransport-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "webtransport-server"
path = "src/main.rs"

[dependencies]
# WebTransport/QUIC
wtransport = { workspace = true }
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Collaboration
latex-ide-yrs-collab = { path = "../yrs-collab" }

# Git integration - temporarily disabled for Docker compatibility  
latex-ide-git-manager = { path = "../git-manager", optional = true }
git2 = { version = "0.19", optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Collections
dashmap = "6.1"

# Regex for LaTeX engine detection
regex = "1.0"

# HTTP for fallback
axum = { version = "0.7", features = ["ws"] }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# TLS
rustls-pemfile = "2.0"
rustls = "0.23"

[features]
default = ["native-git"]
native-git = ["latex-ide-git-manager", "git2"]