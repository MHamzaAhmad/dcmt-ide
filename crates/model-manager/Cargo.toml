[package]
name = "latex-ide-model-manager"
version.workspace = true
edition.workspace = true

[[bin]]
name = "model-manager"
path = "src/main.rs"

[dependencies]
# SSE Handler dependency
latex-ide-sse-handler = { path = "../sse-handler" }

# AI/ML Libraries (disabled for development build due to dependency conflicts)
# kalosm = { workspace = true }
# ollama-rs = { workspace = true }
# openai-api-rs = { workspace = true }
# async-openai = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# HTTP server
axum = { workspace = true }

# UUID
uuid = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Configuration
config = { workspace = true }

# Collections
dashmap = "6.1"

# Time
chrono = { workspace = true }

# Regular expressions
regex = "1.10"

[features]
default = []