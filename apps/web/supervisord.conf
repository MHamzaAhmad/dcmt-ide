[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


# WebTransport/WebSocket Server with hot reload
[program:webtransport-server]
command=cargo watch -w crates/webtransport-server -w Cargo.toml -x "run --bin webtransport-server -- --port=3001 --db-path=/app/data/latex_ide.db"
directory=/app
stdout_logfile=/app/logs/webtransport-server.log
stderr_logfile=/app/logs/webtransport-server-error.log
autostart=true
autorestart=true
priority=2
environment=RUST_LOG=debug

# Server-Sent Events Handler with hot reload
[program:sse-handler]
command=cargo watch -w crates/sse-handler -w Cargo.toml -x "run --bin sse-handler -- --port=3002 --db-path=/app/data/latex_ide.db"
directory=/app
stdout_logfile=/app/logs/sse-handler.log
stderr_logfile=/app/logs/sse-handler-error.log
autostart=true
autorestart=true
priority=3
environment=RUST_LOG=debug

# AI Model Manager with hot reload
[program:model-manager]
command=cargo watch -w crates/model-manager -w Cargo.toml -x "run --bin model-manager -- --port=3003 --db-path=/app/data/latex_ide.db"
directory=/app
stdout_logfile=/app/logs/model-manager.log
stderr_logfile=/app/logs/model-manager-error.log
autostart=true
autorestart=true
priority=4
environment=RUST_LOG=debug

# WASM hot reload watcher
[program:wasm-watcher]
command=watchexec -w /app/apps/web -w /app/crates -e rs,toml -- bash -c "cd /app/apps/web && wasm-pack build --target web --out-dir pkg --dev --scope latex-ide && cp -r pkg/* /app/web/pkg/ && echo 'WASM rebuilt and copied at $(date)'"
directory=/app
stdout_logfile=/app/logs/wasm-watcher.log
stderr_logfile=/app/logs/wasm-watcher-error.log
autostart=true
autorestart=true
priority=5

# Web frontend with live reload
[program:web-frontend]
command=live-server --port=8080 --host=0.0.0.0 --entry-file=index.html --no-browser --cors --watch=/app/web,/app/apps/web/pkg
directory=/app/web
stdout_logfile=/app/logs/web-frontend.log
stderr_logfile=/app/logs/web-frontend-error.log
autostart=true
autorestart=true
priority=1

# Log aggregation
[program:log-viewer]
command=tail -f /app/logs/*.log
directory=/app/logs
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autostart=false
autorestart=false
priority=10