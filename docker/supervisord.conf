[supervisord]
nodaemon=true
user=appuser
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=appuser:appgroup

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# LiteLLM Service
[program:litellm]
command=/app/litellm-venv/bin/litellm --config /app/litellm/config.yaml --host 0.0.0.0 --port 4000
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/litellm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/app/litellm-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
priority=50


# DCMT Backend Service
[program:dcmt-backend]
command=/app/backend/dcmt-backend
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=DCMT_HOST="0.0.0.0",DCMT_PORT="3001",DCMT_WORKSPACE_PATH="/app/workspace",LITELLM_BASE_URL="http://127.0.0.1:4000"
priority=100

# Nginx Service (internal HTTP only)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
priority=200

# Log rotation service (optional)
[program:logrotate]
command=/bin/sh -c 'while true; do sleep 86400; find /app/logs -name "*.log" -size +100M -exec truncate -s 50M {} \; ; done'
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/null
priority=300