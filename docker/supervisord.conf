[supervisord]
nodaemon=true
user=appuser
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=appuser:appgroup

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# LiteLLM Service - UDS mode
[program:litellm]
command=/app/litellm-venv/bin/python -m uvicorn litellm.proxy.proxy_server:app --uds /app/litellm.sock --workers 1 --env LITELLM_CONFIG_FILE=/app/litellm/config.yaml
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/litellm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/app/litellm-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
priority=50
# Set socket permissions after starting
startsecs=5
startretries=3
command_post_start=bash -c "chmod 660 /app/litellm.sock && chown appuser:appgroup /app/litellm.sock"


# DCMT Backend Service
[program:dcmt-backend]
command=/app/backend/dcmt-backend
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=DCMT_HOST="0.0.0.0",DCMT_PORT="3001",DCMT_WORKSPACE_PATH="/app/workspace",LITELLM_SOCKET_PATH="/app/litellm.sock",TAVILY_API_KEY="%(ENV_TAVILY_API_KEY)s"
priority=100
depends_on=litellm

# Nginx Service (internal HTTP only)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
priority=200
depends_on=dcmt-backend

# Log rotation service (optional)
[program:logrotate]
command=/bin/sh -c 'while true; do sleep 86400; find /app/logs -name "*.log" -size +100M -exec truncate -s 50M {} \; ; done'
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/null
priority=300