[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Web Frontend Server
[program:web-frontend]
command=live-server --port=8080 --host=0.0.0.0 --entry-file=index.html --no-browser --cors
directory=/app/web
stdout_logfile=/app/logs/web-frontend.log
stderr_logfile=/app/logs/web-frontend-error.log
autostart=true
autorestart=true
priority=1

# WebTransport/WebSocket Server  
[program:webtransport-server]
command=/app/target/debug/webtransport-server --port=3001 --db-path=/app/data/latex_ide.db
directory=/app
stdout_logfile=/app/logs/webtransport-server.log
stderr_logfile=/app/logs/webtransport-server-error.log
autostart=true
autorestart=true
priority=2

# Server-Sent Events Handler
[program:sse-handler]
command=/app/target/debug/sse-handler --port=3002 --db-path=/app/data/latex_ide.db
directory=/app
stdout_logfile=/app/logs/sse-handler.log
stderr_logfile=/app/logs/sse-handler-error.log
autostart=true
autorestart=true
priority=3

# AI Model Manager
[program:model-manager]
command=/app/target/debug/model-manager --port=3003 --db-path=/app/data/latex_ide.db
directory=/app
stdout_logfile=/app/logs/model-manager.log
stderr_logfile=/app/logs/model-manager-error.log
autostart=true
autorestart=true
priority=4

# Log aggregation
[program:log-viewer]
command=tail -f /app/logs/*.log
directory=/app/logs
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autostart=false
autorestart=false
priority=10